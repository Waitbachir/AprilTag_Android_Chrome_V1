<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AprilTag Android Chrome V1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#101216;color:#fff;font-family:Arial,sans-serif}
body{overflow:hidden}#app{height:100%;display:flex;flex-direction:column}
header{padding:10px 12px;background:#181b21;display:flex;justify-content:space-between;align-items:center}
h1{font-size:16px;margin:0}.status{font-size:12px}.ok{color:#8ee28e}.warn{color:#ffd166}.err{color:#ff6b6b}
#view{position:relative;flex:1;background:#000;min-height:0}video{width:100%;height:100%;object-fit:cover;display:block}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#panel{position:absolute;top:10px;left:10px;right:10px;padding:10px;border-radius:10px;background:#000a;font-size:13px;line-height:1.5}
#controls{padding:10px;background:#181b21;display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:9px;padding:13px 8px;background:#2d6cdf;color:#fff;font-weight:bold;font-size:14px}
button.secondary{background:#343941}button:disabled{opacity:.5}
#info{padding:8px 12px;background:#0c0e12;font-size:12px;max-height:120px;overflow:auto}
.tag{padding:5px 0;border-bottom:1px solid #292d35}
</style>
</head>
<body>
<div id="app">
<header><h1>AprilTag — Android Chrome</h1><span id="status" class="status">Prêt</span></header>
<div id="view">
<video id="video" autoplay muted playsinline></video><canvas id="overlay"></canvas>
<div id="panel">
<b>Caméra</b><br>
État : <span id="cameraState">arrêtée</span><br>
Tags détectés : <span id="count">0</span> · <span id="fps">0 FPS</span><br>
Distance : <span id="dist">—</span>
</div>
</div>
<div id="controls">
<button id="start">📷 Autoriser la caméra</button>
<button id="stop" class="secondary">⏹ Arrêter</button>
</div>
<div id="info">
<div id="message">Appuie sur « Autoriser la caméra ». Chrome affichera alors sa demande d'autorisation si la page est lancée via localhost/HTTPS.</div>
<div id="tags"></div>
</div>
</div>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('overlay'),ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status'),stateEl=document.getElementById('cameraState');
let stream=null,running=false,frames=0,last=performance.now();

function resize(){
 const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);
 ctx.setTransform(d,0,0,d,0,0);
}
window.addEventListener('resize',resize);

async function startCamera(){
 try{
  if(!window.isSecureContext) throw new Error("PAGE_NON_SECURisee");
  if(!navigator.mediaDevices?.getUserMedia) throw new Error("CAMERA_NON_DISPONIBLE");
  statusEl.textContent="Demande d’autorisation…";statusEl.className="status warn";
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},
   audio:false
  });
  video.srcObject=stream;await video.play();running=true;resize();
  statusEl.textContent="Caméra active";statusEl.className="status ok";
  stateEl.textContent="active";document.getElementById('message').textContent="Caméra autorisée. Prête pour le moteur AprilTag.";
  requestAnimationFrame(loop);
 }catch(e){
  statusEl.className="status err";
  if(e.message==="PAGE_NON_SECURisee"){
   statusEl.textContent="Mode non sécurisé";
   document.getElementById('message').textContent="Cette page doit être ouverte via http://localhost ou HTTPS. Ne l’ouvre pas directement depuis le gestionnaire de fichiers.";
  }else if(e.name==="NotAllowedError"){
   statusEl.textContent="Permission refusée";
   document.getElementById('message').textContent="Permission refusée. Dans Chrome : Paramètres du site → Caméra → Autoriser, puis recharge la page.";
  }else{
   statusEl.textContent="Erreur caméra";document.getElementById('message').textContent="Erreur : "+e.message;
  }
 }
}
function stopCamera(){
 running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 video.srcObject=null;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);
 stateEl.textContent="arrêtée";statusEl.textContent="Arrêtée";statusEl.className="status";
}
function loop(){
 if(!running)return;frames++;const now=performance.now();
 if(now-last>=1000){document.getElementById('fps').textContent=frames+" FPS";frames=0;last=now}
 ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);requestAnimationFrame(loop);
}
document.getElementById('start').onclick=startCamera;
document.getElementById('stop').onclick=stopCamera;

window.updateTags=function(ds){
 document.getElementById('count').textContent=ds.length;
 const box=document.getElementById('tags');box.innerHTML="";
 ds.forEach(t=>{
  const el=document.createElement('div');el.className='tag';
  el.textContent=`Tag ID ${t.id} — X ${t.x.toFixed(0)} px — Y ${t.y.toFixed(0)} px — Distance ${t.distance_m==null?"—":t.distance_m.toFixed(2)+" m"}`;
  box.appendChild(el);
  if(t.corners?.length===4){
   ctx.beginPath();ctx.moveTo(t.corners[0].x,t.corners[0].y);
   for(let i=1;i<4;i++)ctx.lineTo(t.corners[i].x,t.corners[i].y);ctx.closePath();
   ctx.strokeStyle="#00ff88";ctx.lineWidth=3;ctx.stroke();
  }
 });
 document.getElementById('dist').textContent=ds[0]?.distance_m==null?"—":ds[0].distance_m.toFixed(2)+" m";
};
</script>
</body>
</html>
